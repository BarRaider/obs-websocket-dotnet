name: obs-websocket-dotnet Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [ Debug, Release ]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: obs-websocket-dotnet.sln
      Library_Project_Path: obs-websocket-dotnet\obs-websocket-dotnet.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore
      run: dotnet restore $env:Solution_Name

    - name: Build
      run: dotnet build $env:Solution_Name --no-restore -c ${{ matrix.configuration }}

    - name: Execute unit tests
      run: >
        dotnet test $env:Solution_Name --no-build -c ${{ matrix.configuration }}
        --logger "trx;LogFileName=test-results.trx"
        --collect:"XPlat Code Coverage"
        --results-directory ${{ github.workspace }}\TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.configuration }}
        path: TestResults

    - name: Coverage summary
      if: matrix.configuration == 'Release'
      shell: pwsh
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool
        reportgenerator -reports:TestResults/**/coverage.cobertura.xml -targetdir:coverage -reporttypes:"MarkdownSummaryGithub"
        Get-Content coverage/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY

    # Only the Release build sets <DocumentationFile>, so this is the only configuration where a
    # missing/stale XML doc comment (CS1591, or the committed obs-websocket-dotnet.xml going stale)
    # can be caught.
    - name: Verify committed XML docs are up to date
      if: matrix.configuration == 'Release'
      shell: bash
      run: git diff --exit-code -- obs-websocket-dotnet/obs-websocket-dotnet.xml

    - name: Pack
      if: matrix.configuration == 'Release'
      run: dotnet pack $env:Library_Project_Path --no-build -c Release -o artifacts

    - name: Upload package
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: nupkg
        path: artifacts/*.nupkg
